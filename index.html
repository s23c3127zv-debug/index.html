before:{k:'BEFORE WATCHING',title:'観る前に知っておく',desc:'物語の出発点と、鑑賞前に押さえたい前提を紹介します。',html:`<div class="callout"><b>ネタバレなしのあらすじ</b><p>『ファー・フロム・ホーム』のラストで、ピーター・パーカーがスパイダーマンであることが世間に知られてしまう。突然注目の的となったピーターは、恋人や親友との普通の生活、進学の夢まで揺るがされる。状況を変えようとドクター・ストレンジに助けを求めるが、その試みは思いもよらない危機を招く。</p></div><h2>観るときの3つの視点</h2><div class="step"><b>① 正体が知られることの影響</b><p>ヒーローとしての活動が、ピーター個人の生活にどんな影響を及ぼすか。</p></div><div class="step"><b>② 願いと責任の衝突</b><p>自分の望みを叶えることと、他者を守ることの間でどう判断するか。</p></div><div class="step"><b>③ 過去作とのつながり</b><p>過去のスパイダーマン作品を知っていると、人物や設定の再登場にも注目できる。</p></div><button class="opt" onclick="go('previous')">前作までの流れを確認する</button>`},
previous:{k:'CONNECTIONS',title:'前作までの流れ',desc:'本作を理解するために重要な出来事を整理します。',html:`<h2>MCU版ピーターの歩み</h2><div class="step"><b>『シビル・ウォー／キャプテン・アメリカ』</b><p>トニー・スタークに見いだされ、アベンジャーズの世界と関わり始める。</p></div><div class="step"><b>『スパイダーマン：ホームカミング』</b><p>ヒーローとして認められたい気持ちと、身近な街を守る責任の間で成長する。トニーとの関係もピーターの価値観に影響する。</p></div><div class="step"><b>『アベンジャーズ／インフィニティ・ウォー』『エンドゲーム』</b><p>サノスの脅威と仲間たちの喪失を経験し、トニーとの別れを迎える。</p></div><div class="step"><b>『スパイダーマン：ファー・フロム・ホーム』</b><p>トニーを失った後のピーターが、後継者としての期待に戸惑う。ミステリオの策略によって、最後に正体を暴露される。</p></div><div class="callout"><b>本作のスタート地点</b><p>『ノー・ウェイ・ホーム』は、正体が暴露された直後から物語が始まる。前作のラストが、そのまま本作の問題の出発点になっている。</p></div>`},
count:{k:'YOUR WATCH HISTORY',title:'今まで何回観た？',desc:'これまでの鑑賞回数を選んでください。回数に合わせて、次に観るのが楽しみになる情報を紹介します。',html:`<div class="stack"><button class="opt" onclick="setCount(0)">まだ観ていない・今回が初めて</button><button class="opt" onclick="setCount(1)">1回観たことがある</button><button class="opt" onclick="setCount(2)">2回観たことがある</button><button class="opt" onclick="setCount(3)">3回観たことがある</button><button class="opt" onclick="setCount(4)">4回以上観たことがある</button></div><p class="muted">※ここで選ぶのは「今回観る前まで」の回数です。</p>`},
teaser0:{k:'FIRST WATCH / PREVIEW',title:'初めて観るなら、ここに注目',desc:'鑑賞前に知っておきたいあらすじ・前作までの流れ・注目ポイントを、この画面でまとめて確認できます。',html:`<details class="expandable inline-info"><summary>見る前のあらすじ<span class="expand-preview">正体を知られたピーターに、思いがけない危機が訪れる。</span></summary><div class="expand-body"><p>『ファー・フロム・ホーム』のラストで、ピーター・パーカーがスパイダーマンであることが世間に知られてしまう。突然注目の的となったピーターは、恋人や親友との普通の生活、進学の夢まで揺るがされる。状況を変えようとドクター・ストレンジに助けを求めるが、その試みは思いもよらない危機を招く。</p></div></details><details class="expandable inline-info"><summary>前作までの流れ<span class="expand-preview">MCU版ピーターが経験してきた出来事を時系列で整理。</span></summary><div class="expand-body"><div class="step"><b>『シビル・ウォー／キャプテン・アメリカ』</b><p>トニー・スタークに見いだされ、アベンジャーズの世界と関わり始める。</p></div><div class="step"><b>『スパイダーマン：ホームカミング』</b><p>ヒーローとして認められたい気持ちと、身近な街を守る責任の間で成長する。トニーとの関係もピーターの価値観に影響する。</p></div><div class="step"><b>『アベンジャーズ／インフィニティ・ウォー』『エンドゲーム』</b><p>サノスの脅威と仲間たちの喪失を経験し、トニーとの別れを迎える。</p></div><div class="step"><b>『スパイダーマン：ファー・フロム・ホーム』</b><p>トニーを失った後のピーターが、後継者としての期待に戸惑う。ミステリオの策略によって、最後に正体を暴露される。</p></div><div class="callout"><b>本作のスタート地点</b><p>『ノー・ウェイ・ホーム』は、正体が暴露された直後から物語が始まる。前作のラストが、そのまま本作の問題の出発点になっている。</p></div></div></details><h2>初めて観るときの注目ポイント</h2><div class="callout"><b>ピーターの日常がどう変わる？</b><p>正体を知られたピーターは、ヒーローとしてだけでなく、一人の高校生としても大きな問題に向き合います。大切な人との関係がどう変化するかに注目。</p></div><div class="callout"><b>選択の積み重ねを見てみよう</b><p>目の前の問題を解決しようとする行動が、思いがけない結果につながっていきます。ピーターが何を守ろうとしているのかを追ってみてください。</p></div><div class="teaser-actions"><button class="primary" onclick="go('watch')">▶ 今すぐ映画を見る</button><button class="secondary" onclick="go('reminder')">今回は後で見る</button></div>`},
teaser1:{k:'REWATCH / CHARACTER',title:'次は、人物の心境に注目',desc:'1回観たあとだからこそ、登場人物の行動の裏側を考えながら観られます。',html:`<div class="callout"><b>ピーターはなぜ敵を救おうとした？</b><p>危険を承知でヴィランたちを助けようとするピーター。その判断には、メイから受け取った価値観や、ヒーローとしての責任がどう影響しているのでしょうか。</p></div><div class="callout"><b>メイおばさんの言葉をもう一度</b><p>一度目は物語の大きな出来事として受け取った場面も、ピーターの表情やその後の選択を意識すると、違う意味に見えてくるかもしれません。</p></div><div class="teaser-actions"><button class="primary" onclick="go('watch')">▶ 今すぐもう一度観る</button><button class="opt" onclick="go('hub')">先にネタバレありの人物解説を見る</button><button class="secondary" onclick="go('reminder')">今回は後で見る</button></div>`},
teaser2:{k:'REWATCH / HIDDEN DETAILS',title:'見逃した伏線を探してみよう',desc:'2回目は、序盤の何気ない描写が終盤にどうつながるかを意識してみましょう。',html:`<div class="callout"><b>序盤の小道具や会話</b><p>デス・スター模型やネッドとのハンドシェイクなど、何気ない日常の描写が、終盤の別れや記憶の変化とどう結びついているか。</p></div><div class="callout"><b>3人のピーターの違い</b><p>同じスパイダーマンでも、立ち方や話し方、戦い方に個性があります。3人が並ぶ場面をもう一度観ると、それぞれの経験が見えてきます。</p></div><div class="teaser-actions"><button class="primary" onclick="go('watch')">▶ 今すぐもう一度観る</button><button class="opt" onclick="go('hub')">先にネタバレありの伏線解説を見る</button><button class="secondary" onclick="go('reminder')">今回は後で見る</button></div>`},
teaser3:{k:'REWATCH / THEMES',title:'今度は、物語の意味を深く',desc:'3回目は、出来事そのものよりも「なぜその選択をしたのか」を考える鑑賞へ。',html:`<div class="callout"><b>責任と犠牲はどこで描かれる？</b><p>ピーターは自分の望みをかなえることより、誰かを守ることを選びます。その選択がどの場面で変化していくのかを追ってみましょう。</p></div><div class="callout"><b>結末は本当に新しい始まり？</b><p>最後の手作りスーツや一人で暮らすピーターの姿は、自立を表す一方で、大切な人を失った孤独も感じさせます。どちらの意味が強く見えるでしょうか。</p></div><div class="teaser-actions"><button class="primary" onclick="go('watch')">▶ 今すぐもう一度観る</button><button class="opt" onclick="go('hub')">先にネタバレありのテーマ解説を見る</button><button class="secondary" onclick="go('reminder')">今回は後で見る</button></div>`},
teaser4:{k:'REWATCH / DEEP DIVE',title:'何度観ても、新しい発見を',desc:'何度も観ている人向けに、解釈や演出を比較する視点を用意しました。',html:`<div class="callout"><b>同じ場面を別の人物の視点で</b><p>ピーターだけでなく、MJ、ネッド、ストレンジ、ヴィランたちは何を考えて行動していたのでしょうか。場面ごとに視点を変えてみましょう。</p></div><div class="callout"><b>演出が感情をどう伝えている？</b><p>カメラの距離、登場のタイミング、音楽、衣装の変化など、物語の説明以外の部分にも注目すると、新しい読み取り方が生まれます。</p></div><div class="teaser-actions"><button class="primary" onclick="go('watch')">▶ 今すぐもう一度観る</button><button class="opt" onclick="go('hub')">先にネタバレありの考察・演出解説を見る</button><button class="secondary" onclick="go('reminder')">今回は後で見る</button></div>`},
postwatch:{k:'AFTER WATCHING',title:'観終わった今、どうする？',desc:'今の気持ちに合わせて、次の楽しみ方を選べます。',html:`<div class="callout"><b>鑑賞記録を保存しました</b><p>映画を観終わったあと、気になる場面を深掘りしてからもう一度観ることもできます。</p></div><div class="stack"><button class="primary" onclick="go('count')">今すぐもう一度観たい</button><button class="opt" onclick="go('hub')">ネタバレありの解説を読んでから考えたい</button><button class="secondary" onclick="go('reminder')">また今度観たい・予定を決める</button><button class="opt" onclick="go('home')">今日はここまで</button></div>`},
hub:{k:'YOUR GUIDE',title:'どこから深掘りする？',desc:'知りたいテーマを選んでください。',html:`<div class="grid"><button class="tile" onclick="go('story')"><b>あらすじ・要点</b><small>物語の因果関係を整理</small></button><button class="tile" onclick="go('characters')"><b>人物・人間関係</b><small>選択と関係性の変化</small></button><button class="tile" onclick="go('themes')"><b>テーマ別解説</b><small>責任・犠牲・成長</small></button><button class="tile" onclick="go('clues')"><b>伏線・小道具</b><small>序盤と終盤をつなぐ描写</small></button><button class="tile" onclick="go('legacy')"><b>過去作とのつながり</b><small>3人のスパイダーマン</small></button><button class="tile" onclick="go('craft')"><b>演出・ファンサービス</b><small>音楽・構図・登場演出</small></button></div><button class="opt" onclick="go('deep')">結末の意味をさらに考える</button><button class="opt" onclick="go('sources')">制作情報・出典を確認する</button>`},
story:{k:'STORY / FULL SPOILERS',title:'物語のあらすじ',desc:'ここから先は結末を含むネタバレがあります。',html:`<div class="tag warning">重要な展開・結末を含みます</div><div class="step"><b>1｜正体の暴露と日常の崩壊</b><p>ミステリオによってスパイダーマンの正体を暴かれたピーターは、MJ、ネッド、メイおばさんとともに世間の注目と非難にさらされる。報道や法的な問題に巻き込まれ、ピーターだけでなく親しい人々の進学や生活にも影響が及ぶ。</p></div><div class="step"><b>2｜ストレンジの呪文とマルチバースの亀裂</b><p>ピーターは皆の記憶から「自分がスパイダーマンだ」という事実を消そうと、ドクター・ストレンジに助けを求める。しかし呪文の途中で、ピーターがMJやネッドなど特定の人々には覚えていてほしいと条件を変え続けたため、呪文が不安定になる。結果として、別の宇宙から「ピーター・パーカーがスパイダーマンだと知っている者たち」がこちらの世界へ引き寄せられる。</p></div><div class="step"><b>3｜別世界の敵との遭遇</b><p>ピーターはドクター・オクトパス、グリーン・ゴブリン、エレクトロ、サンドマン、リザードと遭遇する。彼らはそれぞれ異なる世界・時点から来ており、元の世界ではスパイダーマンと敵対していた。ストレンジは彼らを元の世界へ戻そうとするが、ピーターは帰還すれば彼らの一部が死ぬ運命にあると知り、治療して救う道を選ぶ。</p></div><div class="step"><b>4｜救済をめぐる対立とメイの死</b><p>ピーターはスタークの技術などを使い、ヴィランたちの能力や人格を変化させた原因を取り除く装置を作る。しかしノーマン・オズボーンの中にあるグリーン・ゴブリンの人格が表面化し、計画は崩れる。混乱の中でメイおばさんが致命傷を負い、ピーターに「大いなる力には、大いなる責任が伴う」という教えを残して亡くなる。</p></div><div class="step"><b>5｜3人のピーター</b><p>MJとネッドは、別の宇宙から来た2人のピーター・パーカー、すなわちトビー・マグワイア版とアンドリュー・ガーフィールド版のスパイダーマンを見つける。3人はそれぞれの喪失や後悔を共有し、復讐に走りそうなMCU版ピーターを支える。3人は協力してヴィランたちの治療薬を完成させる。</p></div><div class="step"><b>6｜自由の女神での最終決戦</b><p>自由の女神像の改修現場で、3人のスパイダーマンはヴィランたちと戦う。ドック・オクやエレクトロらを治療し、グリーン・ゴブリンとの対決では、ピーターが怒りに任せて殺害しそうになる。もう1人のピーターが身を挺して止め、復讐の連鎖を断つ。</p></div><div class="step"><b>7｜世界からピーター・パーカーが忘れられる</b><p>マルチバースの境界が崩れ、別世界の人々が流入し始める。事態を止めるため、ピーターはストレンジに「世界中の人々がピーター・パーカーという人物を忘れる」呪文を依頼する。MJやネッドも彼を忘れると理解したうえで、ピーターはその選択を受け入れる。呪文の後、ピーターは2人に自分のことを説明しようとするが、彼らの新しい生活を守るため名乗り出ることをやめる。</p></div><div class="step"><b>8｜新しい始まり</b><p>ピーターは一人で暮らし、自分で作った新しいスーツを身にまとい、街を守るスパイダーマンとして活動を続ける。トニー・スタークの支援や、以前の人間関係に頼らない、孤独だが自立したヒーローとしての出発が描かれる。</p></div>`},
characters:{k:'CHARACTERS',title:'人物・人間関係',desc:'人物の関係性は、ピーターの選択と成長を理解する鍵になります。',html:`<h2>MCU側の人物</h2><div class="callout"><b>ピーター・パーカー</b><p>本作の中心人物。正体の暴露によって大切な人々の日常が壊れたことに責任を感じる。敵を倒すだけでなく、彼らを救おうとする選択を通じて、ヒーローとしての責任を学ぶ。</p></div><div class="callout"><b>メイ・パーカー</b><p>ピーターの行動を支える保護者。ヴィランたちにも救われる可能性があると信じ、ピーターの倫理観を後押しする。彼女の死は、ピーターに「責任」の重さを突きつける転換点となる。</p></div><div class="callout"><b>MJ（ミシェル・ジョーンズ）</b><p>ピーターの恋人。危機の中でも冷静さを保ち、ピーターの決断を支える。最後にはピーターの記憶を失うが、彼から事情を聞いてもなお、彼の選択を尊重する。</p></div><div class="callout"><b>ネッド・リーズ</b><p>ピーターの親友。魔法の指輪を使ってポータルを開くなど、思いがけない形で事態に関わる。ピーターとの友情は、結末で失われる日常の象徴でもある。</p></div><div class="callout"><b>ドクター・ストレンジ</b><p>記憶を消す呪文を実行する魔術師。ピーターの願いを叶えようとするが、危険を理解しているため、ヴィランを元の世界へ戻すことを優先する。ピーターとは「結果を管理すること」と「個人を救うこと」の考え方が対立する。</p></div><h2>別の宇宙から来た人物</h2><div class="callout"><b>ノーマン・オズボーン／グリーン・ゴブリン</b><p>善良な科学者としての人格と、ゴブリンの人格がせめぎ合う。ピーターの善意を利用し、物語の対立を最も深刻なものへ変える。</p></div><div class="callout"><b>オットー・オクタビアス／ドック・オク</b><p>機械の腕に制御を奪われていた科学者。装置によって本来の人格を取り戻すことが、ピーターの「敵を治す」という考えが実現可能であることを示す。</p></div><div class="callout"><b>トビー版・アンドリュー版ピーター</b><p>それぞれ異なる喪失を経験した先輩のピーター。若いピーターの怒りを受け止め、復讐ではなく救済を選ぶよう助ける。3人の共通点と違いを見せる役割を担う。</p></div>`},
themes:{k:'THEMES',title:'テーマ別解説',desc:'物語の出来事を、作品全体を貫く考え方から読み解きます。',html:`<div class="callout"><b>1｜大いなる力と責任</b><p>本作では「責任」は、敵を倒すことだけを意味しない。自分の行動が生んだ結果から逃げず、相手が敵であっても救う可能性を考えることとして描かれる。メイの言葉は、ピーターが選択を続けるための倫理的な軸になる。</p><p><b>考える問い：</b>ピーターは、どの時点で「自分の責任」を引き受ける覚悟を決めたのか。</p></div><div class="callout"><b>2｜救済と犠牲</b><p>ヴィランを治療して元の世界へ返す行動は、目先の安全よりも相手の未来を選ぶ試みである。一方、その選択はメイの死やピーター自身の孤独につながる。善意の行動が必ずしも望んだ結果を生むわけではない点が、物語に苦みを与える。</p><p><b>考える問い：</b>誰かを救うために、どこまで自分の生活を犠牲にできるのか。</p></div><div class="callout"><b>3｜成長と自立</b><p>これまでのMCU版ピーターは、トニー・スタークの技術や助言に支えられてきた。結末では支援者や人間関係を失い、自分の判断と技術で生活を築き始める。喪失は悲劇であると同時に、ピーターが独立したヒーローになる通過点でもある。</p><p><b>考える問い：</b>最後のピーターは、序盤のピーターと何が変わったのか。</p></div><div class="callout"><b>4｜記憶とアイデンティティ</b><p>最後の呪文は、周囲の人々からピーター・パーカーの存在そのものを忘れさせる。人間関係や社会的なつながりが消えても、彼の選択や行動まで消えるわけではない。誰かに知られていることと、自分が何者であるかは同じではない、という問いを残す。</p><p><b>考える問い：</b>誰からも覚えられていなくても、ピーターは同じ自分でいられるのか。</p></div><div class="callout"><b>5｜怒りと赦し</b><p>メイを失ったピーターは、ゴブリンへの復讐に傾く。別世界のピーターたちが自らの経験をもとに彼を止めることで、過去の痛みを次の世代に繰り返さないという選択が示される。</p><p><b>考える問い：</b>復讐をやめることは、相手を許すことと同じなのか。</p></div>`},
clues:{k:'CLUES / EASTER EGGS',title:'伏線・小道具・見落としやすい描写',desc:'序盤の小さな描写が、後半や過去作の記憶とどう結びつくかを確認します。',html:`<div class="tag warning">ネタバレあり</div><div class="callout"><b>① 『ホームカミング』のデス・スター模型</b><p>ピーターとネッドが作ったデス・スターの模型が再登場する。かつての高校生活や親友との何気ない時間を象徴し、結末でピーターが一人になった状況との対比を生む。</p><p class="muted">分類：過去作の小道具／日常の象徴</p></div><div class="callout"><b>② ネッドとピーターのハンドシェイク</b><p>シリーズを通じて描かれてきた2人の友情の合図。本作でも繰り返され、最後にその関係が失われることをより切なく感じさせる。</p><p class="muted">分類：反復モチーフ／人物関係</p></div><div class="callout"><b>③ メイの「大いなる力には、大いなる責任が伴う」</b><p>スパイダーマンというキャラクターを象徴する言葉が、MCU版ピーターにとって決定的な意味を持つ。後半、別世界のピーターたちも同じ言葉を知っていると分かり、異なる人生を歩んだ3人を結びつける。</p><p class="muted">分類：台詞の回収／シリーズ共通テーマ</p></div><div class="callout"><b>④ アンドリュー版ピーターがMJを救う</b><p>自由の女神でMJが落下した際、アンドリュー版ピーターが彼女を救う。彼は過去にグウェンを救えなかった経験を抱えており、この行動はその喪失を乗り越える瞬間として読める。</p><p class="muted">分類：過去作の悲劇の反復と変化</p></div><div class="callout"><b>⑤ ドック・オクの「大きくなったな」</b><p>ドック・オクはトビー版ピーターを見て、かつて知っていた若いピーターとの時間の経過を感じ取る。敵味方を超えて、過去作の人物たちがそれぞれの人生を続けてきたことを短い会話で伝える。</p><p class="muted">分類：再会の台詞／時間経過</p></div><div class="callout"><b>⑥ 最後の新しいスーツ</b><p>結末でピーターが身につけるスーツは、以前のハイテク装備とは異なるシンプルな手作りのもの。支援や装備に頼らず、自分自身の力で活動する新しい段階を視覚的に示している。</p><p class="muted">分類：衣装の変化／自立の象徴</p></div><div class="callout"><b>⑦ 「誰もピーター・パーカーを覚えていない」という呪文</b><p>序盤の呪文は「スパイダーマンの正体を忘れさせる」目的だったが、最終的にはピーター・パーカーという人物の記憶そのものを消す選択になる。冒頭と結末で「忘却」の意味が大きく変わっている。</p><p class="muted">分類：構成上の対比／物語の回収</p></div>`},
legacy:{k:'MULTIVERSE / LEGACY',title:'過去作とのつながり',desc:'本作は複数の実写スパイダーマン映画の歴史を物語に組み込みます。',html:`<div class="callout"><b>3人のピーターが集まる意味</b><p>トビー・マグワイア版、アンドリュー・ガーフィールド版、トム・ホランド版のピーターが同じ画面に立つことは、単なる登場人物の集合ではない。それぞれが異なる喪失や後悔を経験し、その経験を共有することで、MCU版ピーターの選択を支える。</p></div><h2>それぞれの経験</h2><div class="callout"><b>トビー版</b><p>長いヒーロー活動を経た先輩として、怒りや喪失を乗り越えてきた視点を持つ。若いピーターに落ち着いて向き合い、復讐を止めようとする。</p></div><div class="callout"><b>アンドリュー版</b><p>グウェンを救えなかった悲しみを抱えている。MJを救う行動は、過去にできなかったことを別の形でやり遂げる場面として解釈できる。</p></div><div class="callout"><b>トム版</b><p>メイの死によって怒りに支配されかけるが、2人の経験を聞き、復讐ではなく救済を選ぶ。</p></div><div class="callout"><b>ヴィランたちの再登場</b><p>ドック・オク、グリーン・ゴブリン、サンドマン、リザード、エレクトロは、それぞれ過去の映画で描かれたスパイダーマンとの因縁を持つ。本作では「悪役を倒す」だけでなく「彼らが悪役になった原因を取り除く」という新しい課題が加わる。</p></div>`},
craft:{k:'FILMMAKING',title:'演出・ファンサービス',desc:'懐かしさを楽しませる演出と、ピーターの感情を伝える演出を分けて見てみましょう。',html:`<div class="callout"><b>1｜登場を遅らせる構成</b><p>過去作のスパイダーマンを早い段階で見せず、観客の期待を段階的に高める。再登場そのものをサプライズにしながら、登場後は彼らの経験を物語の中心に結びつける。</p></div><div class="callout"><b>2｜3人の身体表現の違い</b><p>同じスパイダーマンでも、立ち方や動き、会話のテンポに違いがある。3人を並べることで、それぞれの時代のピーターの個性を視覚的に伝える。</p></div><div class="callout"><b>3｜アクションを感情の決着に使う</b><p>最終決戦は派手な戦闘だけではなく、ピーターが復讐を選ぶか、救済を選ぶかという内面的な葛藤の場でもある。戦いの勝敗と主人公の成長が結びついている。</p></div><div class="callout"><b>4｜衣装の変化で新章を示す</b><p>最後の手作りスーツは、ピーターの生活とヒーロー活動が新しい段階に入ったことを示す。装備の豪華さではなく、自分で作り上げたことに意味がある。</p></div><div class="callout"><b>5｜ファンサービスを物語に回収する</b><p>過去作の人物・台詞・関係性を登場させるだけで終わらず、現在のピーターの決断を変える役割を与えている。過去作を知らない観客には協力者として、知っている観客には過去の物語の続きとして機能する。</p></div>`},
deep:{k:'INTERPRETATION',title:'結末をどう読み解くか',desc:'ここでは事実として描かれた出来事と、そこから導ける解釈を分けて考えます。',html:`<div class="callout"><b>作中で起きたこと</b><p>ピーターは世界中の人々がピーター・パーカーを忘れる呪文を選び、MJやネッドを含む全員が彼の存在を忘れる。彼は2人に自分のことを伝えようとするが、彼らの生活を守るために名乗らない。</p></div><div class="callout"><b>解釈A｜ヒーローとしての責任の完成</b><p>ピーターは自分の願いよりも、世界を守ることと大切な人の安全を優先する。序盤では自分の生活を取り戻すために呪文を求めたが、最後は自分の生活を失うことを受け入れる。</p></div><div class="callout"><b>解釈B｜ピーター・パーカーとスパイダーマンの分離</b><p>周囲から個人としての記憶を失われても、ピーターはスパイダーマンとして人々を守り続ける。誰かに認められることではなく、自分が何をするかによってヒーローであることを示す。</p></div><div class="callout"><b>解釈C｜孤独は成長の代償なのか</b><p>自立した新しい出発として肯定的に見ることもできる一方、支えてくれる人々を失った過酷な結末とも読める。成長と幸福が必ずしも同時に訪れない点が、結末を bittersweet（ほろ苦い）ものにしている。</p></div><h2>自分の考察を深める問い</h2><ul class="bullet"><li>ピーターは最後に本当に正しい選択をしたのか。</li><li>MJとネッドに真実を伝えないことは、彼らを守る行動なのか。</li><li>新しいスーツは、これまでのピーターと何を変えたのか。</li></ul>`},
level1:{k:'LEVEL 1 / SUMMARY',title:'まずは物語の要点',desc:'1回目の鑑賞後に、物語の骨格を整理するための情報です。',html:`<div class="callout"><b>この作品の中心にある問い</b><p>自分の行動が招いた危機に対して、ピーターはどこまで責任を負うのか。</p></div><ul class="bullet"><li>正体の暴露でピーターの日常が壊れる。</li><li>ストレンジの呪文がマルチバースの危機を招く。</li><li>ピーターは敵を倒すのではなく、治療して救おうとする。</li><li>メイの死を経て、責任の重さを知る。</li><li>最後に自分の存在を忘れさせ、孤独な新生活を始める。</li></ul><button class="opt" onclick="go('story')">詳しいあらすじを読む</button><button class="opt" onclick="go('characters')">人物関係を整理する</button>`},
level2:{k:'LEVEL 2 / CONNECTIONS',title:'伏線と過去作のつながり',desc:'2回目の鑑賞では、再登場や反復される描写に注目します。',html:`<div class="callout"><b>見返すときの着眼点</b><p>序盤の小道具や会話が、終盤の喪失や決断とどう結びつくかを探します。</p></div><ul class="bullet"><li>デス・スター模型：ネッドとの日常と友情。</li><li>ハンドシェイク：2人の関係を示す反復。</li><li>メイの言葉：3人のピーターをつなぐ共通の価値観。</li><li>アンドリュー版ピーターの救出：過去の喪失の変化。</li><li>最後のスーツ：自立したヒーローへの変化。</li></ul><button class="opt" onclick="go('clues')">伏線を個別に詳しく見る</button><button class="opt" onclick="go('legacy')">過去作とのつながり</button>`},
level3:{k:'LEVEL 3 / THEMES',title:'テーマと演出を読み解く',desc:'3回目以降は、出来事の意味や別の解釈を考えます。',html:`<div class="callout"><b>見方を一段深める</b><p>「何が起きたか」だけでなく、「なぜその選択をしたのか」「観客にどのような感情を生むのか」を考えます。</p></div><button class="opt" onclick="go('themes')">責任・犠牲・成長のテーマ</button><button class="opt" onclick="go('craft')">演出とファンサービス</button><button class="opt" onclick="go('deep')">結末の解釈を比較する</button>`},
sources:{k:'SOURCES & NOTES',title:'情報の出典・制作メモ',desc:'作品の基本情報と公式あらすじは公式情報を参照。テーマ・伏線の説明は作品描写をもとにした解釈です。',html:`<h2>作品情報・公式説明</h2><p class="source">Sony Pictures公式作品ページ：作品概要、登場人物、前作との関係、マルチバース設定。<br><a href="https://www.sonypictures.com/movies/spidermannowayhome" target="_blank" rel="noopener">Sony Pictures – Spider-Man: No Way Home</a></p><p class="source">Disney+作品ページ：日本語の作品紹介、公開年、上映時間等。<br><a href="https://www.disneyplus.com/ja-jp/browse/entity-295fb45a-c8bb-477e-816f-b0706b4d9984" target="_blank" rel="noopener">Disney+ – スパイダーマン：ノー・ウェイ・ホーム</a></p><h2>制作側の発言・補助資料</h2><p class="source">脚本家インタビュー：結末でピーターが孤立し、自立したヒーローになる構想や、メイの死・呪文の意味について。<br><a href="https://www.thewrap.com/spider-man-no-way-home-ending-writers-interview-chris-mckenna-erik-sommers/" target="_blank" rel="noopener">TheWrap – Writers on the Ending</a></p><p class="source">Marvel公式：結末の選択と、ピーターが支払う代償について。<br><a href="https://www.marvel.com/articles/movies/spider-man-no-way-home-tom-holland-zendaya-bittersweet-ending" target="_blank" rel="noopener">Marvel – The Bittersweet Ending</a></p><p class="source">過去作の小道具・台詞などの確認補助：<br><a href="https://www.radiotimes.com/movies/spider-man-no-way-home-easter-eggs/" target="_blank" rel="noopener">Radio Times – Easter Eggs and Cameos</a></p><div class="callout"><b>研究上の区別</b><p>「作中で明確に起きたこと」と「そこから読み取れるテーマ・象徴的な意味」を区別して記述しています。伏線の意味づけや演出意図の一部は、公式に断定された説明ではなく、作品に基づく解釈です。</p></div><p class="source">※本画面の解説文は、映画の内容を研究用に要約・分析したオリジナル文章です。映画本編の台詞を長く転載していません。</p>`}
};
const pageHistory=[];
function go(id, addHistory=true){
  const app=document.getElementById('app');
  const current=app.dataset.page;
  if(id==='home') pageHistory.length=0;
  if(addHistory && current && current!==id) pageHistory.push(current);
  const p=pages[id]||pages.home;
  const back=pageHistory.length?'<div class="backbar"><button class="backbtn" onclick="back()">← 前の画面に戻る</button></div>':'';
  const heading = id==='home' ? '' : `${p.k?`<div class="k">${p.k}</div>`:''}<h1>${p.title}</h1><p>${p.desc}</p>`;
  app.innerHTML=`${back}${heading}${p.html}`;
  app.dataset.page=id;
  makeExpandable(app);
  if(id==='history') refreshHistory();
  if(id==='watch') setupPlayer();
  app.scrollTop=0;
} 
function back(){
  if(!pageHistory.length)return;
  const previous=pageHistory.pop();
  pageHistory.length=0;
  go(previous,false);
}
function setCount(n){localStorage.setItem('cine_note_precount',n);go('teaser'+(n===0?0:n===1?1:n===2?2:n===3?3:4))}

function makeExpandable(root){
  root.querySelectorAll('.callout,.step,.source').forEach((el)=>{
    if(el.closest('details.expandable')) return;
    const titleEl=el.querySelector('b,strong');
    const title=titleEl?titleEl.textContent.trim():'詳しく見る';
    const firstP=el.querySelector('p');
    const preview=firstP?firstP.textContent.trim().slice(0,66)+(firstP.textContent.trim().length>66?'…':''):'';
    const d=document.createElement('details');d.className='expandable';
    const summary=document.createElement('summary');summary.textContent=title;
    if(preview){const span=document.createElement('span');span.className='expand-preview';span.textContent=preview;summary.appendChild(span)}
    const body=document.createElement('div');body.className='expand-body';
    while(el.firstChild) body.appendChild(el.firstChild);
    d.append(summary,body);el.replaceWith(d);
  });
}
function getLog(){try{return JSON.parse(localStorage.getItem('cine_note_log')||'{"count":0,"last":null,"reminder":null}')}catch(e){return {count:0,last:null,reminder:null}}}
function setLog(v){localStorage.setItem('cine_note_log',JSON.stringify(v))}
function recordCompletedViewing(){if(localStorage.getItem('cine_note_session_recorded')==='1')return;const v=getLog();v.count=(v.count||0)+1;v.last=new Date().toLocaleDateString('ja-JP');setLog(v);localStorage.setItem('cine_note_session_recorded','1');localStorage.removeItem('cine_note_watching');go('postwatch');}
function setupPlayer(){const start=document.getElementById('demoStartBtn'),finish=document.getElementById('demoFinishBtn');if(start&&finish){const active=localStorage.getItem('cine_note_watching')==='1';start.disabled=active;finish.disabled=!active;const status=document.getElementById('demoPlayerStatus');if(status)status.textContent=active?'PLAYING':'READY';}}
function startDemoPlayback(){localStorage.setItem('cine_note_watching','1');localStorage.removeItem('cine_note_session_recorded');const start=document.getElementById('demoStartBtn'),finish=document.getElementById('demoFinishBtn'),status=document.getElementById('demoPlayerStatus'),msg=document.getElementById('demoPlayerText');if(start)start.disabled=true;if(finish)finish.disabled=false;if(status)status.textContent='PLAYING';if(msg)msg.textContent='再生中のデモです。視聴終了を再現すると鑑賞回数が自動で記録されます。'}
function finishDemoPlayback(){if(localStorage.getItem('cine_note_watching')!=='1'){alert('先に「再生する（デモ）」を押してください。');return;}recordCompletedViewing();}
// デモでは視聴終了ボタンが動画の ended イベントを再現し、鑑賞回数を自動保存する。実際の配信映像との連携は未実装。
function saveReminder(months){const v=getLog();const base=v.last?new Date():new Date();base.setMonth(base.getMonth()+months);v.reminder=base.toLocaleDateString('ja-JP');v.reminderMonths=months;setLog(v);alert(months+'か月後（'+v.reminder+'）の再鑑賞予定を保存しました。');go('history')}
function refreshHistory(){const v=getLog();const a=document.getElementById('historyCount'),b=document.getElementById('historyDate'),c=document.getElementById('historyReminder');if(a)a.textContent='鑑賞回数：'+(v.count||0)+'回';if(b)b.textContent='最終鑑賞日：'+(v.last||'—');if(c)c.textContent='次の再鑑賞：'+(v.reminder||'未設定')}
function quickChat(t){const i=document.getElementById('chatInput');if(i)i.value=t;sendChat()}
function sendChat(){const i=document.getElementById('chatInput');if(!i||!i.value.trim())return;const q=i.value.trim();i.value='';const log=document.getElementById('chatLog');const u=document.createElement('div');u.className='chat-bubble user';u.textContent=q;log.appendChild(u);const a=document.createElement('div');a.className='chat-bubble bot';a.textContent=chatAnswer(q);log.appendChild(a);log.scrollIntoView({block:'end',behavior:'smooth'})}
function chatAnswer(q){if(q.includes('3人')||q.includes('集まる'))return '3人が集まることは、過去作のファンサービスだけでなく、それぞれの喪失や後悔を共有し、トム版ピーターの選択を支える意味があります。特に、復讐ではなく救済を選ぶための大切な出会いとして描かれています。';if(q.includes('メイ')||q.includes('言葉'))return 'メイの言葉は、ピーターがヒーローとして責任を引き受けるための倫理的な軸になります。敵を倒すだけでなく、相手を救おうとする選択にもつながっています。';if(q.includes('注目')||q.includes('再鑑賞'))return '再鑑賞では、①序盤のデス・スター模型やハンドシェイク、②メイの言葉が出てくる場面、③3人のピーターの会話や動きの違い、④最後の手作りスーツに注目してみてください。';if(q.includes('伏線'))return '伏線を見るなら、序盤に登場する小道具や何気ない会話が、終盤の喪失・友情・自立とどう結びつくかに注目すると発見があります。「伏線・小道具」の解説も見てみてください。';return '面白い視点だね。作品では、ピーターが何を選び、その選択によって誰の生活が変わるのかを追うと理解が深まります。関連する「人物・人間関係」「テーマ別解説」も開いてみてね。'}

go('home');
